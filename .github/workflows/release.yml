name: Desktop releases

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, fileinfo, openssl, dom, tokenizer
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction
          npm ci
      - name: Check release version
        shell: bash
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - name: PHP tests
        run: php artisan test --compact
      - name: Desktop tests
        run: npm run test:desktop
      - name: Linux runtime tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb libasound2t64 libgtk-3-0t64 libnss3
      - name: Windows runtime tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Package native application
        run: node desktop/package.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install and exercise Linux package with sandbox enabled
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo dpkg -i dist/release/*.deb
          RESONA_SMOKE_OUTPUT="$RUNNER_TEMP/resona-smoke" xvfb-run -a /opt/Resona/resona --smoke-test
      - name: Exercise Windows package with sandbox enabled
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:RESONA_SMOKE_OUTPUT = "$env:RUNNER_TEMP/resona-smoke"
          $installer = Get-ChildItem dist/release/*.exe | Select-Object -First 1
          $installDirectory = "$env:RUNNER_TEMP/Resona-installed"
          $installation = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDirectory" -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw "Installation failed: $($installation.ExitCode)" }
          $app = Start-Process -FilePath "$installDirectory/resona.exe" -ArgumentList '--smoke-test' -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/resona-stdout.log" -RedirectStandardError "$env:RUNNER_TEMP/resona-stderr.log"
          Get-Content "$env:RUNNER_TEMP/resona-stdout.log"
          Get-Content "$env:RUNNER_TEMP/resona-stderr.log"
          if ($app.ExitCode -ne 0) { throw "Smoke failed: $($app.ExitCode)" }
          if (!(Test-Path "$env:RESONA_SMOKE_OUTPUT/results.json")) { throw 'Missing smoke results' }
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ runner.os }}
          path: |
            ${{ runner.temp }}/resona-smoke/*.json
            ${{ runner.temp }}/resona-smoke/*.png
            ${{ runner.temp }}/resona-*.log
      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            dist/release/*.exe
            dist/release/*.zip
            dist/release/*.deb
            dist/release/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd release
          sha256sum Resona-* > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Resona $GITHUB_REF_NAME" --notes-file ../desktop/release-notes.md
